[package]
name = "cwapi-desktop"
version = "1.5.1"
description = "CWapi Windows desktop shell"
authors = ["CWapi"]
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"

[lib]
name = "cwapi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
urlencoding = "2"
